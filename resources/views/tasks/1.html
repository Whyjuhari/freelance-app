    <script>
        // Sidebar Toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');

            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        // View Toggle
        function switchView(view) {
            const kanbanView = document.getElementById('kanbanView');
            const listView = document.getElementById('listView');
            const kanbanBtn = document.getElementById('kanbanBtn');
            const listBtn = document.getElementById('listBtn');

            if (view === 'kanban') {
                kanbanView.classList.remove('hidden');
                listView.classList.add('hidden');
                kanbanBtn.classList.add('bg-gradient-to-r', 'from-blue-600', 'to-indigo-600', 'text-white');
                kanbanBtn.classList.remove('text-gray-600', 'hover:bg-gray-100');
                listBtn.classList.remove('bg-gradient-to-r', 'from-blue-600', 'to-indigo-600', 'text-white');
                listBtn.classList.add('text-gray-600', 'hover:bg-gray-100');
            } else {
                kanbanView.classList.add('hidden');
                listView.classList.remove('hidden');
                listBtn.classList.add('bg-gradient-to-r', 'from-blue-600', 'to-indigo-600', 'text-white');
                listBtn.classList.remove('text-gray-600', 'hover:bg-gray-100');
                kanbanBtn.classList.remove('bg-gradient-to-r', 'from-blue-600', 'to-indigo-600', 'text-white');
                kanbanBtn.classList.add('text-gray-600', 'hover:bg-gray-100');
            }
        }

        // Task Modal
        function openAddTaskModal() {
            document.getElementById('addTaskModal').classList.remove('hidden');
        }

        function closeAddTaskModal() {
            document.getElementById('addTaskModal').classList.add('hidden');
        }

        // Close modal when clicking outside
        document.getElementById('addTaskModal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeAddTaskModal();
            }
        });

        // Initialize kanban as default view
        document.addEventListener('DOMContentLoaded', function () {
            switchView('kanban');
        });
    </script>
